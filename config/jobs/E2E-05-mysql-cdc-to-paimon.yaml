job:
  mode: streaming
  sparkHome: ${SPARK_HOME}
  sparkPuddingHome: ${PUDDING_HOME}
  appName: e2e-05-mysql-cdc-to-paimon
  master: local[2]
  deployMode: client
  describe: MySQL binlog CDC into a Paimon primary-key table
  config:
    spark.ui.enabled: 'false'
    spark.sql.shuffle.partitions: '4'
    spark.driver.memory: 2g
    spark.driver.cores: '2'
  trigger: 'processing-time: 5 seconds'
source:
- type: mysql-cdc-source
  id: source-1
  config:
    url: ${MYSQL_URL}
    user: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    database: source_db
    table: orders_smoke
    schema: order_id bigint, customer_id bigint, amount decimal(12,2), status string, city string, order_time timestamp, updated_at timestamp, payload string
    snapshotMode: initial
    maxRecordsPerBatch: '1000'
    options:
      database.allowPublicKeyRetrieval: 'true'
sink:
- type: paimon-sink
  id: sink-1
  dependency: source-1
  config:
    path: ${PUDDING_TEST_ROOT}/data/generated/lakehouse/paimon/pudding_test.db/e2e05_orders
    primaryKey:
    - order_id
    bucket: 1
    outputMode: append
    # Stable across runs: E2E-05 restarts the job and expects the checkpoint to resume.
    checkpointLocation: ${PUDDING_TEST_ROOT}/results/state/e2e-05/checkpoint
    checkpointRetention: keep
    cdcOpColumn: __op
    cdcOrderFields:
    - _cdc_timestamp
    - _cdc_sequence
