job:
  mode: batch
  sparkHome: ${SPARK_HOME}
  sparkPuddingHome: ${PUDDING_HOME}
  appName: sk-04-mysql-sink smoke
  master: local[2]
  deployMode: client
  describe: mysql-sink smoke
  config:
    spark.ui.enabled: 'false'
    spark.sql.shuffle.partitions: '4'
    spark.driver.memory: 2g
    spark.driver.cores: '2'
source:
- type: file-common-source
  id: source-1
  config:
    path: ${PUDDING_TEST_DATA}/orders.csv
    fileType: csv
    streamRead: false
    forceConvertSchema: true
    options:
      header: 'true'
      delimiter: ','
    schema:
      order_id: long
      customer_id: long
      amount: double
      status: string
      city: string
      order_time: timestamp
      updated_at: timestamp
      payload: string
sink:
- type: mysql-sink
  id: sink-1
  dependency: source-1
  config:
    url: ${MYSQL_TARGET_URL}
    table: orders
    user: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver: com.mysql.cj.jdbc.Driver
    mode: overwrite
