job:
  mode: batch
  sparkHome: ${SPARK_HOME}
  sparkPuddingHome: ${PUDDING_HOME}
  appName: e2e-12b-build-iceberg
  master: local[2]
  deployMode: client
  describe: build a 1,000-row Iceberg table for the incremental sync case
  config:
    spark.ui.enabled: 'false'
    spark.sql.shuffle.partitions: '4'
    spark.driver.memory: 2g
    spark.driver.cores: '2'
catalog:
- name: iceberg_lake
  type: iceberg
  properties:
    type: hadoop
    warehouse: ${PUDDING_TEST_ROOT}/data/generated/lakehouse/iceberg
source:
- type: file-common-source
  id: orders
  config:
    path: ${PUDDING_TEST_DATA}/orders.csv
    fileType: csv
    streamRead: false
    forceConvertSchema: true
    options:
      header: 'true'
      delimiter: ','
    schema:
      order_id: long
      customer_id: long
      amount: double
      status: string
      city: string
      order_time: timestamp
      updated_at: timestamp
      payload: string
transform:
- type: limit-transform
  id: first_rows
  dependencies: [orders]
  config:
    limit: 1000
sink:
- type: iceberg-sink
  id: sink-1
  dependency: first_rows
  catalog: iceberg_lake
  config:
    table: pudding_test.e2e12b_orders
    mode: overwrite
