job:
  mode: batch
  sparkHome: ${SPARK_HOME}
  sparkPuddingHome: ${PUDDING_HOME}
  appName: os-02-iceberg-s3fileio-read
  master: local[2]
  deployMode: client
  describe: Read the Iceberg table through the same JDBC catalog and S3FileIO
  config:
    spark.ui.enabled: 'false'
    spark.sql.shuffle.partitions: '2'
    spark.driver.memory: 2g
    spark.driver.cores: '2'
    spark.driver.extraJavaOptions: -Daws.region=us-east-1
source:
- type: iceberg-source
  id: source-1
  catalog: iceberg_s3
  config:
    table: ${OS02_TABLE}
sink:
- type: file-sink
  id: sink-1
  dependency: source-1
  config:
    path: ${CASE_OUT}/read
    fileType: json
    saveMode: overwrite
catalog:
- name: iceberg_s3
  type: iceberg
  properties:
    type: jdbc
    uri: jdbc:postgresql://localhost:15432/iceberg_catalog
    jdbc.user: ${OS_CATALOG_USER_REF}
    jdbc.password: ${OS_CATALOG_PASSWORD_REF}
    jdbc.schema-version: V1
    warehouse: ${OS02_WAREHOUSE}
    io-impl: org.apache.iceberg.aws.s3.S3FileIO
    s3.endpoint: ${MINIO_ENDPOINT}
    s3.path-style-access: 'true'
    s3.access-key-id: ${OS_LAKE_ACCESS_KEY_REF}
    s3.secret-access-key: ${OS_LAKE_SECRET_KEY_REF}
