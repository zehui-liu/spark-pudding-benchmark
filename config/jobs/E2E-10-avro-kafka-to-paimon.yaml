job:
  mode: streaming
  sparkHome: ${SPARK_HOME}
  sparkPuddingHome: ${PUDDING_HOME}
  appName: e2e-10-avro-kafka-to-paimon
  master: local[2]
  deployMode: client
  describe: Kafka Avro with Schema Registry into a Paimon table
  config:
    spark.ui.enabled: 'false'
    spark.sql.shuffle.partitions: '4'
    spark.driver.memory: 2g
    spark.driver.cores: '2'
  trigger: 'processing-time: 2 seconds'
source:
- type: kafka-source
  id: source-1
  config:
    kafkaBootstrapServers: ${KAFKA_BOOTSTRAP}
    subscribe: orders-avro
    valueFormat: avro
    valueSchema:
      order_id: long
      customer_id: long
      amount: double
      status: string
      city: string
      order_time: string
      updated_at: string
      payload: string
    schemaRegistry:
      url: ${SCHEMA_REGISTRY_URL}
      subject: orders-avro-value
    options:
      startingOffsets: earliest
      maxOffsetsPerTrigger: '5000'
sink:
- type: paimon-sink
  id: sink-1
  dependency: source-1
  config:
    path: ${PUDDING_TEST_ROOT}/results/state/e2e-10/avro/pudding_test.db/e2e10_avro_orders
    primaryKey:
    - order_id
    bucket: 1
    outputMode: append
    checkpointLocation: ${PUDDING_TEST_ROOT}/results/state/e2e-10/avro-checkpoint
    checkpointRetention: keep
