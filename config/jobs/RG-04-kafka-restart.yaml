job:
  mode: streaming
  sparkHome: ${SPARK_HOME}
  sparkPuddingHome: ${PUDDING_HOME}
  appName: rg-04-kafka-restart
  master: local[2]
  deployMode: client
  describe: checkpoint-bound Kafka source across a broker restart
  config:
    spark.ui.enabled: 'false'
    spark.sql.shuffle.partitions: '4'
    spark.driver.memory: 2g
    spark.driver.cores: '2'
  trigger: 'processing-time: 2 seconds'
source:
- type: kafka-source
  id: source-1
  config:
    kafkaBootstrapServers: ${KAFKA_BOOTSTRAP}
    subscribe: orders-smoke
    valueFormat: json
    valueSchema:
      order_id: long
      customer_id: long
      amount: double
      status: string
      city: string
      order_time: timestamp
      updated_at: timestamp
      payload: string
    options:
      startingOffsets: earliest
      maxOffsetsPerTrigger: '5000'
sink:
- type: file-sink
  id: sink-1
  dependency: source-1
  config:
    path: ${CASE_OUT}/result
    fileType: json
    isStreaming: true
    outputMode: append
    checkpointLocation: ${PUDDING_TEST_ROOT}/results/state/rg-04/checkpoint
    checkpointRetention: keep
