job:
  mode: batch
  sparkHome: ${SPARK_HOME}
  sparkPuddingHome: ${PUDDING_HOME}
  appName: tr-04-transform smoke
  master: local[2]
  deployMode: client
  describe: transform smoke
  config:
    spark.ui.enabled: 'false'
    spark.sql.shuffle.partitions: '4'
    spark.driver.memory: 2g
    spark.driver.cores: '2'
source:
- type: file-common-source
  id: source-1
  config:
    path: ${PUDDING_TEST_DATA}/orders.csv
    fileType: csv
    streamRead: false
    forceConvertSchema: true
    options:
      header: 'true'
      delimiter: ','
    schema:
      order_id: long
      customer_id: long
      amount: double
      status: string
      city: string
      order_time: timestamp
      updated_at: timestamp
      payload: string
transform:
- type: column-transform
  id: column1
  dependencies:
  - source-1
  config:
    fields:
    - order_id
    - name: city_name
      source: city
      type: string
    - name: amount
      type: double
sink:
- type: file-sink
  id: sink-1
  dependency: column1
  config:
    path: ${CASE_OUT}/result
    fileType: json
    saveMode: overwrite
