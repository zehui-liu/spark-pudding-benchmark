job:
  mode: batch
  sparkHome: ${SPARK_HOME}
  sparkPuddingHome: ${PUDDING_HOME}
  appName: sk-06-elasticsearch-sink smoke
  master: local[2]
  deployMode: client
  describe: elasticsearch-sink smoke
  config:
    spark.ui.enabled: 'false'
    spark.sql.shuffle.partitions: '4'
    spark.driver.memory: 2g
    spark.driver.cores: '2'
source:
- type: file-common-source
  id: source-1
  config:
    path: ${PUDDING_TEST_DATA}/orders.csv
    fileType: csv
    streamRead: false
    forceConvertSchema: true
    options:
      header: 'true'
      delimiter: ','
    schema:
      order_id: long
      customer_id: long
      amount: double
      status: string
      city: string
      order_time: timestamp
      updated_at: timestamp
      payload: string
sink:
- type: elasticsearch-sink
  id: sink-1
  dependency: source-1
  config:
    esNodes: localhost
    esPort: ${ES_PORT}
    esIndex: sk06_orders
    operation: index
    idField: order_id
    mode: overwrite
    options:
      es.batch.size.entries: '1000'
      es.nodes.wan.only: 'true'
