job:
  mode: batch
  sparkHome: ${SPARK_HOME}
  sparkPuddingHome: ${PUDDING_HOME}
  appName: sr-08-hudi-source smoke
  master: local[2]
  deployMode: client
  describe: hudi-source smoke
  config:
    spark.ui.enabled: 'false'
    spark.sql.shuffle.partitions: '4'
    spark.driver.memory: 2g
    spark.driver.cores: '2'
source:
- type: hudi-source
  id: source-1
  config:
    table: orders
    tablePath: ${PUDDING_TEST_ROOT}/data/generated/lakehouse/hudi/orders
    filterExpr: order_id <= 10000
sink:
- type: file-sink
  id: sink-1
  dependency: source-1
  config:
    path: ${CASE_OUT}/source
    fileType: json
    saveMode: overwrite
