job:
  mode: streaming
  sparkHome: ${SPARK_HOME}
  sparkPuddingHome: ${PUDDING_HOME}
  appName: os-03-hdfs-checkpoint
  master: local[2]
  deployMode: client
  describe: File streaming with a checkpoint on HDFS and a local file sink
  trigger: available-now
  config:
    spark.ui.enabled: 'false'
    spark.sql.shuffle.partitions: '2'
    spark.driver.memory: 2g
    spark.driver.cores: '2'
    spark.hadoop.dfs.client.use.datanode.hostname: 'true'
source:
- type: file-common-source
  id: source-1
  config:
    path: ${OS03_INPUT}
    fileType: csv
    streamRead: true
    options:
      header: 'true'
      delimiter: ','
    schema:
      order_id: long
      customer_id: long
      amount: double
      status: string
      city: string
      order_time: timestamp
      updated_at: timestamp
      payload: string
sink:
- type: file-sink
  id: sink-1
  dependency: source-1
  config:
    path: ${OS03_OUTPUT}
    fileType: json
    outputMode: append
    checkpointLocation: ${OS03_CHECKPOINT}
    checkpointRetention: keep
