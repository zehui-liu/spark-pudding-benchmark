job:
  mode: streaming
  sparkHome: ${SPARK_HOME}
  sparkPuddingHome: ${PUDDING_HOME}
  appName: e2e-10-avro-custom-subject
  master: local[2]
  deployMode: client
  describe: Kafka Avro decoded through a non-default Schema Registry subject
  trigger: available-now
  config:
    spark.ui.enabled: 'false'
    spark.sql.shuffle.partitions: '2'
    spark.driver.memory: 2g
    spark.driver.cores: '2'
source:
- type: kafka-source
  id: source-1
  config:
    kafkaBootstrapServers: ${KAFKA_BOOTSTRAP}
    subscribe: ${AVRO_TOPIC}
    valueFormat: avro
    valueSchema:
      order_id: long
      customer_id: long
      amount: double
      status: string
      city: string
      order_time: string
      updated_at: string
      payload: string
    schemaRegistry:
      url: ${SCHEMA_REGISTRY_URL}
      subject: ${AVRO_SUBJECT}
    options:
      startingOffsets: earliest
      maxOffsetsPerTrigger: '5000'
sink:
- type: file-sink
  id: sink-1
  dependency: source-1
  config:
    path: ${CASE_OUT}/result
    fileType: json
    outputMode: append
    checkpointLocation: ${AVRO_CHECKPOINT}
    checkpointRetention: keep
