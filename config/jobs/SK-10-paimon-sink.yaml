job:
  mode: batch
  sparkHome: ${SPARK_HOME}
  sparkPuddingHome: ${PUDDING_HOME}
  appName: sk-10-paimon-sink smoke
  master: local[2]
  deployMode: client
  describe: paimon-sink smoke
  config:
    spark.ui.enabled: 'false'
    spark.sql.shuffle.partitions: '4'
    spark.driver.memory: 2g
    spark.driver.cores: '2'
catalog:
- name: paimon_lake
  type: paimon
  properties:
    warehouse: ${PUDDING_TEST_ROOT}/data/generated/lakehouse/paimon
    metastore: filesystem
source:
- type: file-common-source
  id: source-1
  config:
    path: ${PUDDING_TEST_DATA}/orders.csv
    fileType: csv
    streamRead: false
    forceConvertSchema: true
    options:
      header: 'true'
      delimiter: ','
    schema:
      order_id: long
      customer_id: long
      amount: double
      status: string
      city: string
      order_time: timestamp
      updated_at: timestamp
      payload: string
sink:
- type: paimon-sink
  id: sink-1
  dependency: source-1
  catalog: paimon_lake
  config:
    table: pudding_test.sk10_orders
    primaryKey:
    - order_id
    bucket: 1
    mode: overwrite
