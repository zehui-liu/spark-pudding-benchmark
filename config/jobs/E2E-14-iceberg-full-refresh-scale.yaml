job:
  mode: sync
  strategy: full
  sparkHome: ${SPARK_HOME}
  sparkPuddingHome: ${PUDDING_HOME}
  appName: e2e-14-iceberg-full-refresh-scale
  master: local[2]
  deployMode: client
  describe: 1.3 GiB CSV full refresh into an existing Iceberg table
  config:
    spark.ui.enabled: 'false'
    # The local driver is also the executor; a 1.3 GiB CSV needs more heap
    # and more write partitions than the smoke template.
    spark.sql.shuffle.partitions: '16'
    spark.sql.adaptive.enabled: 'false'
    spark.driver.memory: 8g
    spark.driver.cores: '2'
source:
- type: file-common-source
  id: source-1
  config:
    path: ${PUDDING_TEST_DATA}/orders.csv
    fileType: csv
    streamRead: false
    forceConvertSchema: true
    options:
      header: 'true'
      delimiter: ','
    schema:
      order_id: long
      customer_id: long
      amount: double
      status: string
      city: string
      order_time: timestamp
      updated_at: timestamp
      payload: string
catalog:
- name: iceberg_lake
  type: iceberg
  properties:
    type: hadoop
    warehouse: ${PUDDING_TEST_ROOT}/data/generated/lakehouse/iceberg
sink:
- type: iceberg-sink
  id: sink-1
  dependency: source-1
  config:
    table: pudding_test.e2e14_orders
  catalog: iceberg_lake
