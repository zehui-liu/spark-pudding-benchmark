job:
  mode: batch
  sparkHome: ${SPARK_HOME}
  sparkPuddingHome: ${PUDDING_HOME}
  appName: e2e-13-es-roundtrip-source
  master: local[2]
  deployMode: client
  describe: read back the index written by the Elasticsearch sink
  config:
    spark.ui.enabled: 'false'
    spark.sql.shuffle.partitions: '4'
    spark.driver.memory: 2g
    spark.driver.cores: '2'
source:
- type: elasticsearch-source
  id: source-1
  config:
    esNodes: localhost
    esPort: ${ES_PORT}
    esIndex: sk06_orders
    limit: 100000
    scrollSize: 1000
    options:
      es.nodes.wan.only: 'true'
sink:
- type: file-sink
  id: sink-1
  dependency: source-1
  config:
    path: ${CASE_OUT}/result
    fileType: json
    saveMode: overwrite
