job:
  mode: sync
  strategy: full
  sparkHome: ${SPARK_HOME}
  sparkPuddingHome: ${PUDDING_HOME}
  appName: e2e-14-hive-full-refresh
  master: local[2]
  deployMode: client
  describe: CSV to Hive full refresh
  config:
    spark.ui.enabled: 'false'
    spark.sql.shuffle.partitions: '4'
    spark.driver.memory: 2g
    spark.driver.cores: '2'
    spark.sql.catalogImplementation: hive
    spark.sql.warehouse.dir: ${PUDDING_TEST_ROOT}/data/hive/warehouse
    spark.hadoop.javax.jdo.option.ConnectionURL: jdbc:derby:;databaseName=${PUDDING_TEST_ROOT}/data/hive/metastore_db;create=true
source:
- type: file-common-source
  id: source-1
  config:
    path: ${PUDDING_TEST_DATA}/orders.csv
    fileType: csv
    streamRead: false
    forceConvertSchema: true
    options:
      header: 'true'
      delimiter: ','
    schema:
      order_id: long
      customer_id: long
      amount: double
      status: string
      city: string
      order_time: timestamp
      updated_at: timestamp
      payload: string
transform:
- type: limit-transform
  id: limit-rows
  dependencies:
  - source-1
  config:
    limit: ${E2E14_LIMIT}
sink:
- type: hive-sink
  id: sink-1
  dependency: limit-rows
  config:
    table: default.pudding_e2e14_hive
    mode: overwrite
    allowNonAtomicReplace: true
