job:
  mode: sync
  strategy: incremental
  sparkHome: ${SPARK_HOME}
  sparkPuddingHome: ${PUDDING_HOME}
  appName: os-01-s3a-incremental-state
  master: local[2]
  deployMode: client
  describe: PostgreSQL incremental upsert with the filesystem state backend on S3A
  config:
    spark.ui.enabled: 'false'
    spark.sql.shuffle.partitions: '2'
    spark.driver.memory: 2g
    spark.driver.cores: '2'
    spark.hadoop.fs.s3a.endpoint: ${MINIO_ENDPOINT}
    spark.hadoop.fs.s3a.path.style.access: 'true'
    spark.hadoop.fs.s3a.connection.ssl.enabled: 'false'
    spark.hadoop.fs.s3a.aws.credentials.provider: org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
    spark.hadoop.fs.s3a.access.key: ${OS_STATE_ACCESS_KEY_REF}
    spark.hadoop.fs.s3a.secret.key: ${OS_STATE_SECRET_KEY_REF}
source:
- type: jdbc-source
  id: os01_source
  config:
    url: ${PG_URL}
    user: ${PG_USER}
    password: ${PG_PASSWORD}
    table: public.os01_orders
    cursorField: updated_at
    incremental:
      semantics: upsert
      keyFields:
      - order_id
      initial: full
      statePath: ${OS01_STATE_PATH}
      allowBestEffortLock: ${OS01_ALLOW_BEST_EFFORT}
sink:
- type: jdbc-sink
  id: os01_target
  dependency: os01_source
  config:
    url: ${PG_TARGET_URL}
    user: ${PG_USER}
    password: ${PG_PASSWORD}
    table: public.os01_orders
