job:
  mode: streaming
  sparkHome: ${SPARK_HOME}
  sparkPuddingHome: ${PUDDING_HOME}
  appName: e2e-06-mysql-cdc-to-hudi
  master: local[2]
  deployMode: client
  describe: MySQL binlog CDC into a Hudi copy-on-write table
  config:
    spark.ui.enabled: 'false'
    spark.sql.shuffle.partitions: '4'
    spark.driver.memory: 2g
    spark.driver.cores: '2'
    spark.serializer: org.apache.spark.serializer.KryoSerializer
  trigger: 'processing-time: 5 seconds'
source:
- type: mysql-cdc-source
  id: source-1
  config:
    url: ${MYSQL_URL}
    user: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    database: source_db
    table: orders_smoke
    schema: order_id bigint, customer_id bigint, amount decimal(12,2), status string, city string, order_time timestamp, updated_at timestamp, payload string
    snapshotMode: initial
    maxRecordsPerBatch: '1000'
    options:
      database.allowPublicKeyRetrieval: 'true'
sink:
- type: hudi-sink
  id: sink-1
  dependency: source-1
  config:
    table: e2e06_orders
    tablePath: ${PUDDING_TEST_ROOT}/results/state/e2e-06/hudi/orders
    tableType: COPY_ON_WRITE
    recordKeyFields:
    - order_id
    preCombineField: updated_at
    outputMode: append
    checkpointLocation: ${PUDDING_TEST_ROOT}/results/state/e2e-06/hudi-checkpoint
    checkpointRetention: keep
    cdcOpColumn: __op
    cdcOrderFields:
    - _cdc_timestamp
    - _cdc_sequence
