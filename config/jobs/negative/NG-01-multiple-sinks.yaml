job:
  mode: batch
  sparkHome: ${SPARK_HOME}
  sparkPuddingHome: ${PUDDING_HOME}
  appName: ng-01-multiple-sinks
  master: local[2]
  deployMode: client
  describe: two sinks must be rejected before the job starts
  config:
    spark.ui.enabled: 'false'
source:
- type: file-common-source
  id: source-1
  config:
    path: ${PUDDING_TEST_DATA}/orders.csv
    fileType: csv
    streamRead: false
    forceConvertSchema: true
    options:
      header: 'true'
      delimiter: ','
    schema:
      order_id: long
      customer_id: long
      amount: double
      status: string
      city: string
      order_time: timestamp
      updated_at: timestamp
      payload: string
sink:
- type: file-sink
  id: sink-1
  dependency: source-1
  config:
    path: ${CASE_OUT}/first
    fileType: json
    saveMode: overwrite
- type: file-sink
  id: sink-2
  dependency: source-1
  config:
    path: ${CASE_OUT}/second
    fileType: json
    saveMode: overwrite
