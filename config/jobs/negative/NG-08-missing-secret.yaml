job:
  mode: batch
  sparkHome: ${SPARK_HOME}
  sparkPuddingHome: ${PUDDING_HOME}
  appName: ng-08-missing-secret
  master: local[2]
  deployMode: client
  describe: unresolved secret reference must fail without exposing a value
  config:
    spark.ui.enabled: 'false'
source:
- type: jdbc-source
  id: source-1
  config:
    url: ${PG_URL}
    user: ${PG_USER}
    password: ${secret:env/PUDDING_NG08_MISSING}
    table: public.orders_smoke
sink:
- type: file-sink
  id: sink-1
  dependency: source-1
  config:
    path: ${CASE_OUT}/result
    fileType: json
    saveMode: overwrite
