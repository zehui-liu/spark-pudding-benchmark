job:
  mode: batch
  sparkHome: ${SPARK_HOME}
  sparkPuddingHome: ${PUDDING_HOME}
  appName: e2e-03-validate-quarantine
  master: local[2]
  deployMode: client
  describe: validate rows, quarantine invalid ones, then enforce a schema contract
  config:
    spark.ui.enabled: 'false'
    spark.sql.shuffle.partitions: '4'
    spark.driver.memory: 2g
    spark.driver.cores: '2'
source:
- type: file-common-source
  id: orders
  config:
    path: ${PUDDING_TEST_DATA}/e2e03_orders.csv
    fileType: csv
    streamRead: false
    forceConvertSchema: true
    options:
      header: 'true'
      delimiter: ','
    schema:
      order_id: long
      customer_id: long
      amount: double
      status: string
      city: string
      order_time: timestamp
      updated_at: timestamp
      payload: string
transform:
- type: validate-transform
  id: validated
  dependencies: [orders]
  config:
    requiredColumns:
    - order_id
    - amount
    - city
    rules:
      amount_nonnegative: amount >= 0
      city_present: city is not null and city <> ''
    mode: drop
    quarantinePath: ${CASE_OUT}/quarantine
- type: schema-contract-transform
  id: contracted
  dependencies: [validated]
  config:
    columns:
      order_id: long
      customer_id: long
      amount: double
      status: string
      city: string
      order_time: timestamp
      updated_at: timestamp
      payload: string
    allowExtraColumns: true
sink:
- type: file-sink
  id: sink-1
  dependency: contracted
  config:
    path: ${CASE_OUT}/result
    fileType: json
    saveMode: overwrite
