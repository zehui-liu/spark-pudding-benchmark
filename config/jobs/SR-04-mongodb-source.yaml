job:
  mode: batch
  sparkHome: ${SPARK_HOME}
  sparkPuddingHome: ${PUDDING_HOME}
  appName: sr-04-mongodb-source smoke
  master: local[2]
  deployMode: client
  describe: mongodb-source smoke
  config:
    spark.ui.enabled: 'false'
    spark.sql.shuffle.partitions: '4'
    spark.driver.memory: 2g
    spark.driver.cores: '2'
source:
- type: mongodb-source
  id: source-1
  config:
    uri: ${MONGO_URI}
    database: source_db
    collection: orders_smoke
    options:
      readPreference.name: primary
sink:
- type: file-sink
  id: sink-1
  dependency: source-1
  config:
    path: ${CASE_OUT}/source
    fileType: json
    saveMode: overwrite
