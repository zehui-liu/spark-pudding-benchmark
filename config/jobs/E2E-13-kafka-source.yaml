job:
  mode: batch
  sparkHome: ${SPARK_HOME}
  sparkPuddingHome: ${PUDDING_HOME}
  appName: e2e-13-kafka-roundtrip-source
  master: local[2]
  deployMode: client
  describe: read back the topic written by the Kafka sink
  config:
    spark.ui.enabled: 'false'
    spark.sql.shuffle.partitions: '4'
    spark.driver.memory: 2g
    spark.driver.cores: '2'
source:
- type: kafka-source
  id: source-1
  config:
    kafkaBootstrapServers: ${KAFKA_BOOTSTRAP}
    subscribe: orders-sink-smoke
    valueFormat: string
    options:
      startingOffsets: earliest
      endingOffsets: latest
sink:
- type: file-sink
  id: sink-1
  dependency: source-1
  config:
    path: ${CASE_OUT}/result
    fileType: json
    saveMode: overwrite
