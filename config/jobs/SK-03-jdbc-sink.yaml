job:
  mode: batch
  sparkHome: ${SPARK_HOME}
  sparkPuddingHome: ${PUDDING_HOME}
  appName: sk-03-jdbc-sink smoke
  master: local[2]
  deployMode: client
  describe: jdbc-sink smoke
  config:
    spark.ui.enabled: 'false'
    spark.sql.shuffle.partitions: '4'
    spark.driver.memory: 2g
    spark.driver.cores: '2'
source:
- type: file-common-source
  id: source-1
  config:
    path: ${PUDDING_TEST_DATA}/orders.csv
    fileType: csv
    streamRead: false
    forceConvertSchema: true
    options:
      header: 'true'
      delimiter: ','
    schema:
      order_id: long
      customer_id: long
      amount: double
      status: string
      city: string
      order_time: timestamp
      updated_at: timestamp
      payload: string
sink:
- type: jdbc-sink
  id: sink-1
  dependency: source-1
  config:
    url: ${PG_TARGET_URL}
    table: public.orders
    user: ${PG_USER}
    password: ${PG_PASSWORD}
    driver: org.postgresql.Driver
    mode: overwrite
    options:
      batchsize: '1000'
