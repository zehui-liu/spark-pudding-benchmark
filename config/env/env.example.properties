# Copy to env.local.properties and adjust for the local machine.
# Entries are exported to the pudding submission process.

JAVA_HOME=/path/to/jdk-11
SPARK_HOME=/path/to/spark-3.4.0-bin-hadoop3
PUDDING_HOME=/path/to/spark-pudding-1.0.0

# Uncomment when the HDFS profile is used.
# HADOOP_CONF_DIR=/path/to/hadoop/conf

# MinIO credentials used by S3A jobs. Keep this file at mode 0600.
AWS_ACCESS_KEY_ID=pudding
AWS_SECRET_ACCESS_KEY=pudding-secret
